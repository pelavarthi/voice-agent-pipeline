[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "voice-agent-pipeline"
version = "0.1.0"
description = "Real-time voice agent pipeline in Python: streaming STT, LLM turn loop, TTS, barge-in."
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
